name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  live-smoke:
    runs-on: ubuntu-latest
    if: ${{ secrets.JUP_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - env:
          JUP_API_KEY: ${{ secrets.JUP_API_KEY }}
        run: pytest -q tests/test_live_smoke.py
