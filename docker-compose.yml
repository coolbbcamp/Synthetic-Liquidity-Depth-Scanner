services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
      POSTGRES_DB: liquidity_scanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d liquidity_scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn liquidity_scanner.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://scanner:scanner@db:5432/liquidity_scanner
      JUP_API_KEY: ${JUP_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  worker:
    build: .
    command: python -m liquidity_scanner.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://scanner:scanner@db:5432/liquidity_scanner
      JUP_API_KEY: ${JUP_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_SCHEDULER: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
